name: Documentation site

# Builds the VitePress site in website/ and deploys it to GitHub Pages (Settings, Pages, Source: GitHub Actions).
# Pull requests only build; the deploy job runs for pushes to main, published releases and manual runs.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "examples/**"
      - "HelloJs/**"
      - "WebSocketBridgeForOBS/src/ObsPlugin.cs"
      - "PLCIcons/**"
      # Every plugin's Store page is built from these files.
      - "*/plugin.json"
      - "*/README.md"
      - "*/CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "examples/**"
      - "HelloJs/**"
      - "WebSocketBridgeForOBS/src/ObsPlugin.cs"
      - "PLCIcons/**"
      # Every plugin's Store page is built from these files.
      - "*/plugin.json"
      - "*/README.md"
      - "*/CHANGELOG.md"
      - ".github/workflows/pages.yml"
  # The Store lists the published releases, so the site is rebuilt when one changes.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run replaces a queued one but never cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # VitePress fails the build on a dead internal link, and the code samples are imported from the real projects
      # (examples/, HelloJs/, WebSocketBridgeForOBS/, PLCIcons/), so a missing file or region fails here too.
      - name: Build the site
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run docs:build

      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  # The tutorial projects must keep compiling. This job does not block the deployment of the site.
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # examples/hello-js is the tutorial copy of HelloJs/; they must not drift apart (region markers are ignored).
      - name: Check that examples/hello-js matches HelloJs
        run: |
          diff --strip-trailing-cr HelloJs/plugin.json examples/hello-js/plugin.json
          diff --strip-trailing-cr HelloJs/index.js <(grep -v '^// #' examples/hello-js/index.js)

      - name: Validate the example manifest
        run: |
          node -e "for (const f of ['examples/hello-js/plugin.json']) { const m = JSON.parse(require('fs').readFileSync(f,'utf8')); for (const k of ['id','name','version','minMacroGrid','entry','kind']) if (!m[k]) throw new Error(f + ': missing ' + k); if (m.kind !== 'js') throw new Error(f + ': the tutorial example must be a JavaScript plugin'); }"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
