name: CI

on:
  # CI runs on pull requests and on pushes to main, not on every push to dev (dev is the working branch).
  # Pushes to main that only touch documentation or license texts do not need a build; pull requests always run, because the required checks of the main ruleset must report on every PR (otherwise a docs-only or site-only PR waits forever). Add [skip ci] to a commit
  # message to skip a run entirely, or start it by hand from the Actions tab (workflow_dispatch).
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "licenses/**", "THIRD_PARTY_NOTICES.md", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md", "macrogrid-index.json"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: macro-grid-plugin

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Stop on known vulnerable dependencies
        working-directory: macro-grid-plugin
        shell: pwsh
        run: |
          $failed = @()
          foreach ($proj in 'OBS/src/MacroGrid.Plugin.Obs.csproj', 'PLCIcons/src/MacroGrid.Plugin.PlcIcons.csproj', 'SoundBoard/src/MacroGrid.Plugin.SoundBoard.csproj') {
            dotnet restore $proj --verbosity quiet
            if ($LASTEXITCODE -ne 0) { throw "restore failed: $proj" }
            $report = dotnet list $proj package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Host $report
            if ($report -match 'has the following vulnerable packages') { $failed += $proj }
          }
          if ($failed.Count) { throw "Known vulnerable packages in: $($failed -join ', ')" }

      - name: Build OBS plugin
        working-directory: macro-grid-plugin
        run: dotnet build OBS/src/MacroGrid.Plugin.Obs.csproj -c Release

      - name: Build PLC Icons plugin
        working-directory: macro-grid-plugin
        run: dotnet build PLCIcons/src/MacroGrid.Plugin.PlcIcons.csproj -c Release

      - name: Test OBS plugin
        working-directory: macro-grid-plugin
        run: dotnet test OBS/tests/MacroGrid.Plugin.Obs.Tests/MacroGrid.Plugin.Obs.Tests.csproj -c Release

      - name: Build SoundBoard plugin
        working-directory: macro-grid-plugin
        run: dotnet build SoundBoard/src/MacroGrid.Plugin.SoundBoard.csproj -c Release

      - name: Test SoundBoard plugin
        working-directory: macro-grid-plugin
        run: dotnet test SoundBoard/tests/MacroGrid.Plugin.SoundBoard.Tests/MacroGrid.Plugin.SoundBoard.Tests.csproj -c Release

  dependency-review:
    name: Dependencies added by this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
