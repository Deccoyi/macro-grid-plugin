# Monthly, and all updates of one folder in a single pull request, to keep CI runs and mail down.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/OBS/src"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      deps:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: "/OBS/tests/MacroGrid.Plugin.Obs.Tests"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      deps:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: "/PLCIcons/src"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      deps:
        patterns: ["*"]
  # No package.json exists yet; add an npm entry when the first one appears.
