name: Feature request
description: Suggest an improvement to an existing plugin
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - OBS
        - PLCIcons
        - HelloJs
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
