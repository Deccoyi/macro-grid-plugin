blank_issues_enabled: false
contact_links:
  - name: Ask a question or share an idea
    url: https://github.com/Deccoyi/macro-grid-plugin/discussions
    about: Questions, ideas and things you made go to Discussions, not to an issue. A maintainer turns a discussion into an issue when there is something to fix or build.
  - name: Report a security vulnerability
    url: https://github.com/Deccoyi/macro-grid-plugin/security/advisories/new
    about: Please report security problems privately here, not in a public issue.
  - name: Macro Grid server and editor issues
    url: https://github.com/Deccoyi/macro-grid/issues
    about: Problems with the server or the editor itself belong in the server repository.
  - name: Macro Grid phone app issues
    url: https://github.com/Deccoyi/macro-grid-client/issues
    about: Problems with the phone app belong in the client repository.
