name: Bug report
description: Something in a plugin does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do not use this form; see SECURITY.md.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - OBS
        - PLCIcons
        - HelloJs
        - Other or not sure
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From the plugin's plugin.json or the Manage Plugins window.
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Macro Grid server version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines. Remove passwords, tokens and personal data first.
      render: text
  - type: dropdown
    id: regression
    attributes:
      label: Did it work in an earlier version?
      options:
        - No, or I am not sure
        - Yes, it worked in an earlier version (write which one below)
      default: 0
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and Discussions, and this is not already reported.
          required: true
